name: "Update test durations to project artifacts"

on:
  workflow_dispatch:
  schedule:
    # At midnight on Sunday
    - cron: "0 0 * * 0"

jobs:
  ci-image:
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  update-test-durations:
    runs-on: ubuntu-latest
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: tvp
          POSTGRES_PASSWORD: tvp
          POSTGRES_DB: tvp
          DEBUG: true
          SECRET_KEY: build_secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Install project dependencies"
        uses: ./.github/actions/poetry

      - name: "Run pytest with coverage"
        working-directory: backend
        run: poetry run pytest --disable-warnings --store-durations
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CITests
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp
          REDIS_URL: redis://redis:6379/0

      - name: "Upload test durations artifact"
        uses: actions/upload-artifact@v7
        with:
          name: test_durations
          path: ./backend/.test_durations
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          overwrite: true

# Copy the Docker base images from AWS Public ECR to the GitHub Container Registry.
# Builds pull the base images from GHCR, so they don't hit the ECR rate limits for anonymous pulls.
# To update a base image, change the tags here and the "FROM" line in the Dockerfile.
# Then run this workflow manually on the pull request branch, so that its builds find the new image:
#   gh workflow run mirror-base-images.yml --ref <branch>
# Pull requests don't run this workflow, so they can't overwrite the base images used on main.
name: "Mirror base images"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-base-images.yml"
  workflow_dispatch:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

env:
  REGISTRY: "ghcr.io"
  TARGET: "ghcr.io/city-of-helsinki/tilavarauspalvelu-core-base"

jobs:
  mirror:
    name: "Mirror ${{ matrix.tag }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      # Copy one image at a time, so we don't hit the ECR limit for requests per second.
      max-parallel: 1
      matrix:
        include:
          - source: "public.ecr.aws/docker/library/node:24-slim"
            tag: "node-24-slim"
          - source: "public.ecr.aws/docker/library/python:3.13-slim-trixie"
            tag: "python-3.13-slim-trixie"

    steps:
    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: "Log in to the Container registry"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Copies the multi-arch manifest from registry to registry without pulling the layers to the runner.
    # Only copy the platforms we use. Each platform adds requests to ECR, and ECR limits requests per second.
    # "linux/amd64" is for CI and OpenShift. "linux/arm64" is for local builds on Apple Silicon.
    - name: "Copy image"
      run: >-
        docker buildx imagetools create
        --platform linux/amd64
        --platform linux/arm64
        --tag ${{ env.TARGET }}:${{ matrix.tag }}
        ${{ matrix.source }}

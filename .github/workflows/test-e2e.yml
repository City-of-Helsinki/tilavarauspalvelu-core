name: "E2E checks"

# Checks the e2e suite without the test environment: its GraphQL queries against the schema, lint, format, that all
# tests load, and the unit tests
on:
  push:
    paths:
      - e2e/**
      - tilavaraus.graphql
      - .github/workflows/test-e2e.yml
    branches:
      - main
  pull_request:
    paths:
      - e2e/**
      - tilavaraus.graphql
      - .github/workflows/test-e2e.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:
  check-e2e:
    name: E2E lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: e2e/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate GraphQL types
        run: pnpm codegen

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: Check that all tests load
        run: pnpm run list

      # About 40 s, half of the job. A pinned Playwright image is large to pull too, and its tag would have to follow
      # every Playwright upgrade
      - name: Install browsers
        run: pnpm e2e:install-deps

      - name: Run e2e suite
        run: pnpm test:unit

      - name: Upload e2e test suite report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-unit-test-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 7

name: "E2E checks"

# Checks the e2e suite without the test environment: its GraphQL queries against the schema, lint, format, that all
# tests load, and the unit tests
on:
  push:
    paths:
      - e2e/**
      - tilavaraus.graphql
      - .github/workflows/test-e2e.yml
      - .github/workflows/playwright-image.yml
    branches:
      - main
  pull_request:
    paths:
      - e2e/**
      - tilavaraus.graphql
      - .github/workflows/test-e2e.yml
      - .github/workflows/playwright-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:
  playwright-image:
    uses: ./.github/workflows/playwright-image.yml
    permissions:
      contents: read

  check-e2e:
    name: E2E lint and unit tests
    runs-on: ubuntu-latest
    needs: playwright-image
    timeout-minutes: 15
    # The image has the browsers. The user is the runner user, as the Playwright docs say for GitHub Actions.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --user 1001
    defaults:
      run:
        # In a container job, the default shell is sh. In the Playwright image, sh is dash.
        # Use bash, like the run-e2e job and jobs on the host runner.
        shell: bash
        working-directory: e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: e2e/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate GraphQL types
        run: pnpm codegen

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: Check that all tests load
        run: pnpm run list

      - name: Run e2e suite
        run: pnpm test:unit

      - name: Upload e2e test suite report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-unit-test-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 7

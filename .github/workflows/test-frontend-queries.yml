name: "Frontend query tests"

on:
  push:
    paths:
      - backend/**
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel a workflow from the same PR, branch or tag when a new workflow is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:

  ci-image:
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  frontend-query-tests:
    name: "Run frontend query tests"
    runs-on: ubuntu-latest
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: tvp
          POSTGRES_PASSWORD: tvp
          POSTGRES_DB: tvp
          DEBUG: true
          SECRET_KEY: build_secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install project dependencies"
        uses: ./.github/actions/poetry

      - name: "Install pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: "Install frontend dependencies"
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: "Pick queries from frontend files"
        working-directory: frontend
        run: pnpm gql-pluck

      - name: "Defragment frontend queries"
        working-directory: backend
        run: poetry run python manage.py defragment_frontend_queries
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CITests
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp
          REDIS_URL: redis://redis:6379/0

      - name: "Run frontend query tests"
        working-directory: backend
        run: |
          poetry run coverage run \
            --branch \
            -m pytest \
              --disable-warnings \
              --only-frontend-query-tests
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CITests
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp
          REDIS_URL: redis://redis:6379/0

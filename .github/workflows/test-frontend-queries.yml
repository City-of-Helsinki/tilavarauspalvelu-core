name: "Frontend query tests"

on:
  push:
    paths:
      - backend/**
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel a workflow from the same PR, branch or tag when a new workflow is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.13
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:

  frontend-query-tests:
    name: "Run frontend query tests"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: tvp
          POSTGRES_PASSWORD: tvp
          POSTGRES_DB: tvp
          DEBUG: true
          SECRET_KEY: build_secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up python"
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install Poetry and project dependencies"
        uses: ./.github/actions/poetry
        with:
          python-version: ${{ steps.setup-python.outputs.python-version }}

      - name: "Install pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: "Install frontend dependencies"
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: "Pick queries from frontend files"
        working-directory: frontend
        run: pnpm gql-pluck

      - name: "Defragment frontend queries"
        working-directory: backend
        run: poetry run python manage.py defragment_frontend_queries
        env:
          DJANGO_SETTINGS_ENVIRONMENT: AutomatedTests

      - name: "Run frontend query tests"
        working-directory: backend
        run: |
          poetry run coverage run \
            --branch \
            -m pytest \
              --disable-warnings \
              --only-frontend-query-tests
        env:
          DJANGO_SETTINGS_ENVIRONMENT: AutomatedTests

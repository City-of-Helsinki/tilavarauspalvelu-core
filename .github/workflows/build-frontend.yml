name: "Build frontend docker images"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - fast-forward

# Cancel a workflow from the same PR, branch or tag when a new workflow is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the builds when a pull request changes only files that the tests do not cover. See detect-skip-tests.yml.
  changes:
    uses: ./.github/workflows/detect-skip-tests.yml
    permissions:
      contents: read
      pull-requests: read

  # Build both ui and admin-ui dockers.
  # The jobs pass "skip" to the build workflow, and do not skip themselves.
  # A skipped caller job does not report the "<caller> / <job>" check that is required for the merge.
  build-ui-docker:
    name: "Build customer ui docker"
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-ui-docker.yml
    permissions:
      contents: read
      packages: write
    with:
      app-name: "customer"
      sentry-project: "tilavarauspalvelu-customer-ui"
      base-url: ""
      skip: ${{ needs.changes.outputs.skip-tests == 'true' }}
    secrets: inherit

  build-admin-ui-docker:
    name: "Build staff ui docker"
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-ui-docker.yml
    permissions:
      contents: read
      packages: write
    with:
      app-name: "staff"
      sentry-project: "tilavarauspalvelu-staff-ui"
      base-url: "/kasittely"
      skip: ${{ needs.changes.outputs.skip-tests == 'true' }}
    secrets: inherit

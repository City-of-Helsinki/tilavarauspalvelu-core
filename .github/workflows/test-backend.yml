name: "Backend tests"

on:
  push:
    paths:
      - backend/**
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel a workflow from the same PR, branch or tag when a new workflow is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13

jobs:

  ci-image:
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  checks:
    name: "Check migrations, translations and outdated graphql schema"
    runs-on: ubuntu-latest
    needs: ci-image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: tvp
          POSTGRES_PASSWORD: tvp
          POSTGRES_DB: tvp
          DEBUG: true
          SECRET_KEY: build_secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install project dependencies"
        uses: ./.github/actions/poetry

      - name: "Test for migration issues"
        working-directory: backend
        run: poetry run python manage.py makemigrations --check --no-color --no-input --dry-run
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CI
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp

      - name: "Test for missing translation"
        working-directory: backend
        run: poetry run python -m config.hooks.translations_done
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CI
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp

      - name: "Test for outdated graphql schema file"
        working-directory: backend
        run: poetry run python manage.py update_graphql_schema
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CITests
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp
          REDIS_URL: redis://redis:6379/0

  test:
    name: "Run tests (${{ matrix.group }}/8)"
    runs-on: ubuntu-latest
    needs: ci-image
    permissions:
      actions: read
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: tvp
          POSTGRES_PASSWORD: tvp
          POSTGRES_DB: tvp
          DEBUG: true
          SECRET_KEY: build_secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        # Length must match "--splits".
        group: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install project dependencies"
        uses: ./.github/actions/poetry

      - name: "Download test durations artifact"
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: update_test_durations.yml
          name: test_durations
          path: backend

      - name: "Run pytest with coverage"
        working-directory: backend
        run: |
          poetry run coverage run \
            --branch \
            -m pytest \
              --disable-warnings \
              --splits 8 \
              --splitting-algorithm least_duration \
              --group ${{ matrix.group }}
        env:
          DJANGO_SETTINGS_ENVIRONMENT: CITests
          DATABASE_URL: postgis://tvp:tvp@postgres:5432/tvp
          REDIS_URL: redis://redis:6379/0
          COVERAGE_FILE: .coverage.${{ matrix.group }}

      # Invalid characters in artifact name: " :  < > | * ? \r \n \ /
      - name: "Create artifact name"
        id: artifact
        run: >-
          echo "artifact=$(
            echo ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }} | sed 's/[":<>|*?\r\n\\/]/-/g'
          )" >> $GITHUB_OUTPUT

      - name: "Upload coverage artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-${{ steps.artifact.outputs.artifact }}-${{ matrix.group }}
          path: ./backend/.coverage.${{ matrix.group }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          overwrite: true

  sonarcloud:
    needs: test
    name: "SonarCloud scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disable shallow cloning to improve relevancy of reporting in SonarCloud
          fetch-depth: 0
          persist-credentials: false

      # Invalid characters in artifact name: " :  < > | * ? \r \n \ /
      - name: "Create artifact name"
        id: artifact
        run: >-
          echo "artifact=$(
            echo ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }} | sed 's/[":<>|*?\r\n\\/]/-/g'
          )" >> $GITHUB_OUTPUT

      - name: "Download coverage artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./backend
          pattern: cov-${{ steps.artifact.outputs.artifact }}-*
          merge-multiple: true

      - name: "Set up python"
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install coverage"
        working-directory: backend
        run: pip install coverage

      - name: "Combine coverage reports and generate XML report"
        working-directory: backend
        run: |
          coverage combine
          coverage xml

      - name: "SonarCloud Scan"
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: ./backend
        # Skip analysis for all bots in pull requests
        if: ${{ github.event_name != 'pull_request' || (! contains(fromJSON(vars.BOTS), github.event.pull_request.user.login)) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

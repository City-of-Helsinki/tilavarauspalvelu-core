# Find out if a pull request changes only files that the backend and frontend tests do not cover.
# These are the e2e suite and the agent files (AGENTS.md and CLAUDE.md in any directory, .agents/, .claude/).
# The e2e suite is a separate project, and the agent files are not part of the service.
# Their changes cannot break the backend or the frontend.
# So the backend and frontend workflows skip their jobs for such a pull request.
# pre-commit.ci is not a workflow here. It still runs for all pull requests.
#
# GitHub counts a skipped required check as passed, but a required check that never starts blocks the merge.
# This is why the workflows skip their jobs, and do not use "paths-ignore" to skip the whole workflow.
#
# Pushes, tags and manual runs always give "false".
# If this job fails, the output is empty. The callers use "!cancelled()", so they run all their jobs.
name: "Detect changes that skip tests"

on:
  workflow_call:
    outputs:
      skip-tests:
        description: "'true' if the pull request changes only the e2e suite, the e2e workflows or the agent files."
        value: ${{ jobs.detect.outputs.skip-tests }}

jobs:
  detect:
    name: "Detect changes that skip tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read

    # "other" is "false" when no changed file is outside the skip paths.
    # The API lists at most 3000 files. A larger pull request can have more files outside the skip paths, so it runs all jobs.
    # Do not compare the file count of the pull request to the file count of the filter.
    # The filter counts a renamed file two times, once for the old path and once for the new path.
    outputs:
      skip-tests: >-
        ${{
          github.event_name == 'pull_request'
          && steps.filter.outputs.other == 'false'
          && github.event.pull_request.changed_files <= 3000
        }}

    steps:
      # For a pull request, the action gets the changed files from the GitHub API. It needs no checkout.
      - name: "Compare changed files to the skip paths"
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file matches "other" if it matches "**" and none of the negated patterns
          predicate-quantifier: some-with-excludes
          filters: |
            other:
              - '**'
              - '!e2e/**'
              - '!.github/workflows/test-e2e.yml'
              - '!.github/workflows/run-e2e.yml'
              - '!.agents/**'
              - '!.claude/**'
              - '!**/AGENTS.md'
              - '!**/CLAUDE.md'

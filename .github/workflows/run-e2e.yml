name: "E2E tests"
# The notification suite always runs with one worker (pnpm test:notifications)
run-name: "E2E tests: ${{ inputs.test_suite }}, ${{ inputs.execution_mode == 'sequential' && 'sequential' || inputs.test_suite == 'Tests_admin_notifications_serial' && '1 worker' || format('{0} workers', inputs.workers) }}"

# Runs the e2e suite against the test environment (https://varaamo.test.hel.ninja/), only when started by hand
on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to run"
        required: true
        default: "All Tests"
        type: choice
        options:
          - All Tests
          - Smoke
          - Tests_user_desktop_FI
          - Tests_user_mobile_iphone_FI
          - Tests_user_mobile_android_FI
          - Tests_users_with_admin_desktop
          - Tests_admin_desktop_FI
          - Tests_admin_notifications_serial
      execution_mode:
        description: "Parallel workers, or one worker with shared users"
        required: true
        default: "parallel"
        type: choice
        options:
          - parallel
          - sequential
      # A GitHub runner has 4 CPUs
      workers:
        description: "Workers in a parallel run"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "4"
          - "5"

# One run at a time: each run deletes and creates the shared test data again
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:
  playwright-image:
    uses: ./.github/workflows/playwright-image.yml
    permissions:
      contents: read

  run-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: playwright-image
    # A sequential run of all tests takes the longest
    timeout-minutes: 120
    # The image has the browsers. The user is the runner user, as the Playwright docs say for GitHub Actions.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --user 1001
    defaults:
      run:
        # In a container job, the default shell is sh. In the Playwright image, sh is dash.
        # The steps use bash syntax, so set bash here.
        shell: bash
        working-directory: e2e
    env:
      # report_summary.py prints times in Helsinki time, like the suite
      TZ: Europe/Helsinki
      # The name of this attempt's reports artifact. The HTML report artifacts start with it too.
      REPORTS: e2e-reports-${{ github.run_number }}-attempt-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: e2e/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        env:
          SUITE: ${{ inputs.test_suite }}
          MODE: ${{ inputs.execution_mode }}
          WORKERS: ${{ inputs.workers }}
          WAF_BYPASS_SECRET: ${{ secrets.WAF_BYPASS_SECRET }}
          ROBOT_API_TOKEN: ${{ secrets.ROBOT_API_TOKEN }}
          DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_ADMIN_PASSWORD }}
        run: |
          missing=""
          for name in WAF_BYPASS_SECRET ROBOT_API_TOKEN DJANGO_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

          if [ "$MODE" = "sequential" ]; then
            export FORCE_SINGLE_USER=True WORKERS=1
          fi

          case "$SUITE" in
            "All Tests") pnpm test:all ;;
            Smoke) pnpm test:smoke ;;
            Tests_admin_notifications_serial) pnpm test:notifications ;;
            *) pnpm exec playwright test --project "$SUITE" ;;
          esac

      # HAR files and traces are for local debugging only (see e2e/README.md).
      # Each attempt has its own artifacts. "Re-run all jobs" deletes the artifacts of the earlier attempts,
      # "Re-run failed jobs" keeps them.
      - name: Upload reports
        id: upload-reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REPORTS }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            !e2e/test-results/**/*.har
            !e2e/test-results/**/trace.zip
          retention-days: 30

      # An artifact of one unzipped file opens in the browser. It gets the file's name, so each HTML report is copied
      # to a file with a name of its own.
      - name: Copy the HTML reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p html-reports
          if [ -f playwright-report/index.html ]; then
            cp playwright-report/index.html "html-reports/$REPORTS.html"
          fi
          if [ -f playwright-report/notifications/index.html ]; then
            cp playwright-report/notifications/index.html "html-reports/$REPORTS-notifications.html"
          fi

      # The screenshots and videos are separate files, so they are only in the zip
      - name: Upload the HTML report
        id: upload-html-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: e2e/html-reports/${{ env.REPORTS }}.html
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the HTML report of the notification tests
        id: upload-notifications-html-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: e2e/html-reports/${{ env.REPORTS }}-notifications.html
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Write summary
        if: ${{ !cancelled() }}
        env:
          # Empty when nothing was uploaded
          REPORTS_URL: ${{ steps.upload-reports.outputs.artifact-url }}
          HTML_REPORT_URL: ${{ steps.upload-html-report.outputs.artifact-url }}
          NOTIFICATIONS_HTML_REPORT_URL: ${{ steps.upload-notifications-html-report.outputs.artifact-url }}
        run: |
          # The links go first: the run page lists the artifacts at the bottom, below the summary
          if [ -n "$REPORTS_URL$HTML_REPORT_URL$NOTIFICATIONS_HTML_REPORT_URL" ]; then
            {
              echo "**Reports**"
              echo
              if [ -n "$HTML_REPORT_URL" ]; then
                echo "- [HTML report]($HTML_REPORT_URL) opens in the browser, without the screenshots and videos"
              fi
              if [ -n "$NOTIFICATIONS_HTML_REPORT_URL" ]; then
                echo "- [HTML report of the notification tests]($NOTIFICATIONS_HTML_REPORT_URL) opens in the browser, without the screenshots and videos"
              fi
              if [ -n "$REPORTS_URL" ]; then
                echo "- [$REPORTS]($REPORTS_URL) is a zip of everything, with the screenshots, videos and error contexts"
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in playwright-report playwright-report/notifications; do
            if [ -f "$report/index.html" ]; then
              python3 tools/report_summary.py "$report" --markdown >> "$GITHUB_STEP_SUMMARY"
            fi
          done

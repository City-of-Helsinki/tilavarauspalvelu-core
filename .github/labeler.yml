# Configuration for actions/labeler: https://github.com/actions/labeler
# Branch rules accept an optional Jira ticket prefix, e.g. "TILA-1234/fix-..." or "fix/...".

# Frontend and e2e PRs often change the frontend query tests and the test data.
# These changes do not need a backend review, so they do not add the backend label.
backend:
  - changed-files:
      - all-globs-to-any-file:
          - "backend/**"
          - "!backend/tests/test_frontend_queries/**"
          - "!backend/tests/test_rest_api/test_create_robot_test_data.py"
          - "!backend/tilavarauspalvelu/management/commands/data_creation/**"
          - "!backend/tilavarauspalvelu/management/commands/create_test_data.py"
          - "!backend/tilavarauspalvelu/management/commands/create_robot_test_data.py"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

e2e:
  - changed-files:
      - any-glob-to-any-file:
          - "e2e/**"
          - ".github/workflows/*e2e*.yml"
          - ".github/workflows/playwright-image.yml"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile*"
          - "**/.dockerignore"
          - "docker-compose.yml"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "**/azure-pipelines-*.yml"
          - "*.just"
          - "**/justfile"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/poetry.lock"
          - "**/pnpm-lock.yaml"
  - head-branch:
      - '^dependabot'
      - '^pre-commit-ci-update-config$'

fix:
  - head-branch:
      - '^(TILA-\d+[/-])?fix[/-]'

feature:
  - head-branch:
      - '^(TILA-\d+[/-])?(feat|feature|add)[/-]'

refactor:
  - head-branch:
      - '^(TILA-\d+[/-])?refactor[/-]'

improvement:
  - head-branch:
      - '^(TILA-\d+[/-])?(improve|improvement|perf|update)[/-]'

chore:
  - head-branch:
      - '^(TILA-\d+[/-])?chore[/-]'

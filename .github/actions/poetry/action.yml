name: "Install project dependencies"
description: "Install project dependencies with Poetry. Run this in the CI image from 'build-ci-image.yml'."

runs:
  using: composite

  steps:

    - name: "Load cached poetry environment"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: backend/.venv
        key: cache-venv-${{ hashFiles('backend/docker/Dockerfile.ci') }}-${{ hashFiles('**/poetry.lock') }}-v2

    - name: "Install dependencies"
      working-directory: backend
      run: poetry install
      shell: bash

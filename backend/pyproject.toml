[project]
name = "Tilavarauspalvelu"
version = "0"
description = "Backend for the new space and resource reservation platform for the City of Helsinki."
authors = []
classifiers = [
    # This prevents accidentally running 'poetry publish'
    "Private :: Do Not Upload",
]
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]  # Use tool.poetry for dependency management

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.dependencies]
Django = "5.2.17"
django-auditlog = "3.4.1"
django-cors-headers = "4.9.0"
django-environment-config = { version = "0.2.3", extras = ["db"] }
django-filter = "26.2"
django-health-check = "4.8.0"
django-helusers = "1.1.0"
django-jinja = "2.11.0"
django-lazy-managers = "0.0.1"
django-lookup-property = "0.2.2"
django-modeltranslation = "0.20.6"
django-mptt = "0.18.0"
django-nh3 = "0.3.1"
django-redis = "7.0.0"
django-resilient-logger = "3.1.0"
djangorestframework = "3.18.1"
easy-thumbnails = "2.10.1"
graphene-django = "3.2.3"
graphene-django-extensions = "0.4.9"
graphene-django-query-optimizer = "0.10.16"
helsinki-profile-gdpr-api = "1.1.0"
html2text = "2025.4.15"
icalendar = "7.3.0"
mjml-python = "1.4.2"
Pillow = "12.3.0"
psycopg2 = "2.9.13"
python-dateutil = "2.9.0.post0"
redis = { version = "6.4.0", extras = ["hiredis"] }
sentry-sdk = "2.71.0"
social-auth-app-django = "5.7.0"
stamina = "26.1.0"
# Skip installation on Windows as uWSGI does not support it without Cygwin.
uWSGI = { version = "2.0.31", markers = "sys_platform != 'win32'" }
whitenoise = "6.12.0"
xhtml2pdf = "0.2.21"
django-csp = "4.0"

[tool.poetry.group.admin.dependencies]
# Dependencies related to the admin panel or other "administrative" tasks.
django-admin-data-views = "0.4.3"
django-admin-extra-buttons = "2.2.1"
django-admin-rangefilter = "0.15.0"
django-admin-sortable2 = "2.3.1"
django-extensions = "4.1"
django-import-export = "4.4.1"
django-more-admin-filters = "1.15"
django-subforms = "0.4.1"
django-tinymce = "5.0.0"

[tool.poetry.group.celery.dependencies]
# Dependencies related to Celery tasks.
celery = { version = "5.6.3", extras = ["redis"] }
django-celery-beat = "2.9.0"
django-celery-results = "2.6.0"

[tool.poetry.group.test.dependencies]
# Dependencies only required for running tests.
factory-boy = "3.3.3"
faker = "40.40.0"
freezegun = "1.5.5"
polib = "1.2.0"
pyinstrument = "5.1.3"
pyjwt = "2.15.1"
pypdf = "6.19.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-django = "4.14.0"
pytest-split = "0.11.0"
pytest-xdist = "3.8.0"

[tool.poetry.group.lint.dependencies]
# Dependencies only required for linting.
pre-commit = "4.6.2"
ruff = "0.16.10"
mypy = "2.4.0"
django-stubs = { version = "6.1.2", extras = ["compatible-mypy"] }

[project.entry-points.pytest11]
tilavarauspalvelu = "tests.plugins"

[tool.ruff]
fix = true
line-length = 120
target-version = "py313"
extend-exclude = [
    "local_settings.py",
    "migrations",
    "config/settings.py",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
preview = true

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = [
    "A",        # flake8-builtins
    "ANN",      # flake8-annotations
    "ARG",      # flake8-unused-arguments
    "ASYNC",    # flake8-async
    "B",        # flake8-bugbear
    "BLE",      # flake8-blind-except
    "C4",       # flake8-comprehensions
    "COM",      # flake8-commas
    "D200",     # pydocstyle: One-line docstring should fit on one line
    "D201",     # pydocstyle: No blank lines allowed before function docstring (found {num_lines})
    "D202",     # pydocstyle: No blank lines allowed after function docstring (found {num_lines})
    "D204",     # pydocstyle: 1 blank line required after class docstring
    "D207",     # pydocstyle: Docstring is under-indented
    "D208",     # pydocstyle: Docstring is over-indented
    "D209",     # pydocstyle: Multi-line docstring closing quotes should be on a separate line
    "D210",     # pydocstyle: No whitespaces allowed surrounding docstring text
    "D211",     # pydocstyle: No blank lines allowed before class docstring
    "D213",     # pydocstyle: Multi-line docstring summary should start at the second line
    "D214",     # pydocstyle: Section is over-indented ("{name}")
    "D215",     # pydocstyle: Section underline is over-indented ("{name}")
    "D301",     # pydocstyle: Use `r"""` if any backslashes in a docstring
    "D402",     # pydocstyle: First line should not be the function's signature
    "D403",     # pydocstyle: First word of the docstring should be capitalized: `{}` -> `{}`
    "D405",     # pydocstyle: Section name should be properly capitalized ("{name}")
    "D406",     # pydocstyle: Section name should end with a newline ("{name}")
    "D407",     # pydocstyle: Missing dashed underline after section ("{name}")
    "D408",     # pydocstyle: Section underline should be in the line following the section's name ("{name}")
    "D409",     # pydocstyle: Section underline should match the length of its name ("{name}")
    "D410",     # pydocstyle: Missing blank line after section ("{name}")
    "D411",     # pydocstyle: Missing blank line before section ("{name}")
    "D412",     # pydocstyle: No blank lines allowed between a section header and its content ("{name}")
    "D414",     # pydocstyle: Section has no content ("{name}")
    "D416",     # pydocstyle: Section name should end with a colon ("{name}")
    "D417",     # pydocstyle: Missing argument description in the docstring for `{definition}`: `{name}`
    "D418",     # pydocstyle: Function decorated with `@overload` shouldn't contain a docstring
    "D419",     # pydocstyle: Docstring is empty
    "DJ",       # flake8-django
    #"DTZ",     # flake8-datetimez  # TODO: Enable this and fix (101) issues
    "E",        # pycodestyle errors
    "EM",       # flake8-errmsg
    "ERA",      # eradicate
    "EXE",      # flake8-executable
    "F",        # pyflakes
    "FA",       # flake8-future-annotations
    "FBT",      # flake8-boolean-trap
    "FIX001",   # flake8-fixme: Line contains FIXME
    "FIX003",   # flake8-fixme: Line contains XXX
    "FIX004",   # flake8-fixme: Line contains HACK
    "FLY",      # flynt
    "FURB",     # refurb
    "G",        # flake8-logging-format
    "I",        # isort
    "ICN",      # flake8-import-conventions
    "INP",      # flake8-no-pep420
    "INT",      # flake8-gettext
    "ISC",      # flake8-implicit-str-concat
    "LOG",      # flake8-logging
    "N",        # pep8-naming
    "PERF",     # Perflint
    "PGH004",   # pygrep-hooks: Use specific rule codes when using `noqa`
    "PGH005",   # pygrep-hooks: Mock methods should be called
    "PIE",      # flake8-pie
    "PL",       # pylint
    "PT",       # flake8-pytest-style
    "PTH",      # flake8-use-pathlib
    "PYI",      # flake8-pyi
    "Q",        # flake8-quotes
    "RET",      # flake8-return
    "RSE",      # flake8-raise
    "RUF",      # ruff-specific rules
    "S",        # flake8-bandit
    "SIM",      # flake8-simplify
    "SLF",      # flake8-self
    "SLOT",     # flake8-slots
    "T10",      # flake8-debugger
    "T20",      # flake8-print
    "TC",       # flake8-type-checking
    "TD001",    # flake8-todos: Invalid TODO tag
    "TD004",    # flake8-todos: Missing colon in TODO
    "TD005",    # flake8-todos: Missing issue description after `TODO`
    "TD006",    # flake8-todos: Invalid TODO capitalization
    "TD007",    # flake8-todos: Missing space after colon in TODO
    "TID",      # flake8-tidy-imports
    "TRY",      # tryceratops
    "UP",       # pyupgrade
    "W",        # pycodestyle warnings
    "YTT",      # flake8-2020
]
# Preview rules
extend-select = [
    "ASYNC119", # yield-in-context-manager-in-async-generator
    "B043",     # del-attr-with-constant
    "B901",     # return-in-generator
    "B903",     # class-as-data-structure
    "B909",     # loop-iterator-mutation
    "D420",     # incorrect-section-order
    "DOC102",   # docstring-extraneous-parameter
    "DOC202",   # docstring-extraneous-returns
    "DOC403",   # docstring-extraneous-yields
    "DOC502",   # docstring-extraneous-exception
    "E262",     # no-space-after-inline-comment
    "E266",     # multiple-leading-hashes-for-block-comment
    "FURB101",  # read-whole-file
    "FURB103",  # write-whole-file
    "FURB113",  # repeated-append
    "FURB118",  # reimplemented-operator
    "FURB131",  # delete-full-slice
    "FURB140",  # reimplemented-starmap
    "FURB142",  # for-loop-set-mutations
    "FURB145",  # slice-copy
    "FURB148",  # unnecessary-enumerate
    "FURB152",  # math-constant
    "FURB154",  # repeated-global
    "FURB180",  # meta-class-abc-meta
    "FURB189",  # subclass-builtin
    "PLC1901",  # compare-to-empty-string
    "PLC2701",  # import-private-name
    "PLC2801",  # unnecessary-dunder-call
    "PLE1141",  # dict-iter-missing-items
    "PLE4703",  # modified-iterating-set
    "PLR0202",  # no-classmethod-decorator
    "PLR0203",  # no-staticmethod-decorator
    "PLR0916",  # too-many-boolean-expressions
    "PLR1702",  # too-many-nested-blocks
    "PLR1712",  # swap-with-temporary-variable
    "PLR6104",  # non-augmented-assignment
    "PLR6201",  # literal-membership
    "PLW0244",  # redefined-slots-in-subclass
    "PLW1514",  # unspecified-encoding
    "PT029",    # pytest-warns-without-warning
    "RUF027",   # missing-f-string-syntax
    "RUF029",   # unused-async
    "RUF031",   # incorrectly-parenthesized-tuple-in-subscript
    "RUF038",   # redundant-bool-literal
    "RUF039",   # unraw-re-pattern
    "RUF045",   # implicit-class-var-in-dataclass
    "RUF047",   # needless-else
    "RUF050",   # unnecessary-if
    "RUF054",   # indented-form-feed
    "RUF055",   # unnecessary-regular-expression
    "RUF056",   # falsy-dict-get-fallback
    "RUF065",   # logging-eager-conversion
    "RUF066",   # property-without-return
    "RUF069",   # float-equality-comparison
    "RUF070",   # unnecessary-assign-before-yield
    "RUF071",   # os-path-commonprefix
    "RUF072",   # useless-finally
    "RUF073",   # f-string-percent-format
    "RUF074",   # incorrect-decorator-order
    "RUF075",   # fallible-context-manager
    "RUF077",   # method-receiver-default
    "S401",     # suspicious-telnetlib-import
    "S402",     # suspicious-ftplib-import
    "S403",     # suspicious-pickle-import
    "S404",     # suspicious-subprocess-import
    "S405",     # suspicious-xml-etree-import
    "S406",     # suspicious-xml-sax-import
    "S407",     # suspicious-xml-expat-import
    "S408",     # suspicious-xml-minidom-import
    "S409",     # suspicious-xml-pulldom-import
    "S411",     # suspicious-xmlrpc-import
    "S412",     # suspicious-httpoxy-import
    "S413",     # suspicious-pycrypto-import
    "S415",     # suspicious-pyghmi-import
    "TC008",    # quoted-type-alias
    "TID254",   # lazy-import-mismatch
    "TID255",   # lazy-import-immediately-resolved
    "UP048",    # while-one
    "UP051",    # deprecated-abc-decorator
    "UP052",    # context-manager-iterator
    "W391",     # too-many-newlines-at-end-of-file
]
ignore = [
    # Conflicting with ruff-format, code style preference
    "COM812",   # missing-trailing-comma

    # No need to annotate mutable class variables with `typing.ClassVar`
    "RUF012",   # mutable-class-default

    # Any-typing allowed
    "ANN401",   # any-type

    # Allow importing inside functions, this is useful for avoiding circular imports.
    "PLC0415",  # import-outside-top-level

    # Allow empty comments. We use empty comments for forcing better code formatting.
    "PLR2044",  # empty-comment

    # Allow type comments for now, since they are useful for documenting types.
    "PYI033",   # legacy-type-comment
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$|^options$|^info$|^name$|^obj$|^request$|^user|^view$|^input_data$|^filters$"
task-tags = ["TODO", "FIXME", "XXX", "type"]

[tool.ruff.lint.extend-per-file-ignores]
"manage.py" = ["I002"]  # missing-required-import
"local_settings*.py" = [
    "ERA001",   # Commented code is fine here.
    "I002"      # missing-required-import
]
"utils/date_utils.py" = [
    "PLR0917",  # Can have as many positional arguments as needed.
    "TID251"    # Can use banned imports here (e.g. datetime.datetime.now)
]
"tilavarauspalvelu/signals.py" = [
    "ARG001",   # Signals can have unused "sender" argument.
]
"tilavarauspalvelu/management/commands/data_creation/*.py" = [
    "PLR0915",  # Can have as many statements as needed.
    "PLR0917",  # Can have as many positional arguments as needed.
    "S101",     # Asserts are fine in test data creation.
    "S311",     # pseudo-random generators are fine here.
]
"tilavarauspalvelu/api/webhooks/serializers.py" = [
    "N802",     # Allow non-lowercase function names for webhook serializers.
    "N815",     # Allow mixedCase variables for webhook serializers.
]
"tilavarauspalvelu/api/graphql/types/*/filtersets.py" = [
    "FBT001",   # Filtersets filter_* methods require three positional arguments, last one being boolean.
]
"tilavarauspalvelu/api/graphql/types/application_round_time_slot/types.py" = [
    "I002"      # Importing `TYPE_CHECKING` to this file causes ImportError for `tilavarauspalvelu.api.graphql.schema.schema` due to `TypedDictListField` inspecting TimeSlot type annotations when converting to a GraphQL field
]
"tests/*.py" = [
    "ANN",      # No need to annotate tests
    "ARG",      # Allow unused arguments in tests (These are usually fixtures)
    "FBT001",   # Factory methods may require positional boolean arguments
    "N801",     # Allow whatever class names in tests
    "N802",     # Allow whatever function names in tests
    "N806",     # Allow whatever variable names in tests
    "N815",     # Allow whatever variable names in tests
    "PLC1901",  # Allow comparing to empty strings.
    "PLR0915",  # Can have as many statements as needed.
    "PLR0917",  # Allow as many positional arguments as needed in tests
    "PLR2004",  # Magic value comparisons are allowed in tests.
    "RUF069",   # Exact float comparisons are fine in tests.
    "S101",     # Obviously asserts are fine in tests
    "S105",     # Hardcoded passwords are fine in tests
    "S106",     # Hardcoded passwords are fine in tests
    "S311",     # Pseudo-random generators are fine here.
    "SLF",      # Allow accessing private members in tests
    "TID251"    # Can use banned imports here (e.g. datetime.datetime.now)
]


[tool.ruff.lint.isort]
split-on-trailing-comma = false
required-imports = [
    "from __future__ import annotations",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "testing",
    "local-folder",
]
sections.testing = [
    "tests",
]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = [
    "typing",
    "ast",
    "lookup_property",
    "graphql",
    "graphene_django",
    "graphene_django_extensions",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.core.handlers.wsgi.WSGIRequest".msg = "Use `tilavarauspalvelu.typing.WSGIRequest` instead."

"datetime.datetime.now".msg = "Use `utils.date_utils.local_datetime` instead."
"django.utils.timezone.now".msg = "Use `utils.date_utils.local_datetime` instead."
"django.utils.timezone.get_default_timezone".msg = "Use `utils.date_utils.DEFAULT_TIMEZONE` instead."

"graphene_django_extensions.typing.GQLInfo".msg = "Use `tilavarauspalvelu.typing.GQLInfo` instead."
"query_optimizer.typing.GQLInfo".msg = "Use `tilavarauspalvelu.typing.GQLInfo` instead."

"django.contrib.auth.get_user_model".msg = "Use `tilavarauspalvelu.models.User` instead."

"html2text".msg = "Use `utils.utils.html_2_text` instead."

"utils.db.NowTT".msg = "Use `utils.db.Now` instead."
"django.db.models.functions.Now".msg = "Use `utils.db.Now` instead."

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    # Python standard libraries
    "base64",
    "csv",
    "datetime",
    "hashlib",
    "hmac",
    "json",
    "logging",
    "math",
    "os",
    "pickle",
    "random",
    "re",
    "shutil",
    "subprocess",
    "sys",
    "tempfile",
    "time",
    "uuid",
    "xml",
    "yaml",
    # Project-specific
    "error_codes",
]

[tool.ruff.lint.flake8-self]
extend-ignore-names = [
    "_meta",
    "_defaults",
    "_errors",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = [
    "pgettext",
    "pgettext_lazy",
    "gettext_lazy",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classproperty",
    "permission",
]
extend-ignore-names = [
    "root",  # Allow using `root` as the first argument name.
]

[tool.ruff.lint.pylint]
max-returns = 8
max-args = 10
max-bool-expr = 6

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
DJANGO_SETTINGS_ENVIRONMENT = "AutomatedTests"
markers = [
    "slow: Marks a test that takes a long time to run.",
    "frontend_query: Marks a frontend query test."
]
python_files = [
    "test_*.py",
]
filterwarnings = [
    "ignore:.*No directory at.*:UserWarning:whitenoise",
]

[tool.coverage.run]
relative_files = true
branch = true
# Use packages instead of directories, since multiple source directories make
# coverage.xml filenames relative to each directory, e.g. 'config/__init__.py'
# becomes '__init__.py', which SonarCloud cannot resolve.
source_pkgs = [
    "tilavarauspalvelu",
    "config",
    "utils",
]

[tool.coverage.report]
omit = [
    "*migrations*",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "def __repr__",
    "def __str__",
]

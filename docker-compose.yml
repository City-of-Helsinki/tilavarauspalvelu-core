# Development setup. Runs the backend and the frontends from the local source code.
# Django runserver and "next dev" reload the code when a file changes.
# Without a profile, only the database and Redis start.
# The "backend" profile starts the backend, the worker and the scheduler.
# The "frontend" profile starts the customer UI and the staff UI. It needs the "backend" profile.
# The "frontend-release" profile builds the customer UI and the staff UI and runs them as in production.
# Use it in place of the "frontend" profile, because both use the same ports.
# Start with "docker compose up --watch" to also rebuild or restart the backend when its dependencies or settings change.
# The backend and the frontends run as the host user, so the files that they create in the source code belong to that user.
# The "just stack" commands set HOST_UID and HOST_GID.
# See the Docker section in README.md.

x-backend: &backend
  build:
    context: backend
    dockerfile: docker/Dockerfile
    args:
      DEPS: main,admin,celery,test,lint
      # Keep the virtualenv out of /tvp, because the source code mount hides /tvp.
      VENV_ROOT: /venv
  image: varaamo-dev-backend
  profiles: [backend]
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # The image gives the root group access to the virtualenv and the static files, as OpenShift needs.
  group_add: ["0"]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DJANGO_SETTINGS_ENVIRONMENT: Docker
    # The host user has no home directory in the image.
    HOME: /tmp
  volumes:
    - ./backend:/tvp
    - type: bind
      source: ./backend/.env.docker
      target: /tvp/.env
      read_only: true
      bind:
        create_host_path: false
    - tvp-media:/media
  develop:
    watch:
      # Settings load only when the process starts. Restart to read a changed .env.docker.
      - action: restart
        path: ./backend/.env.docker
      - action: rebuild
        path: ./backend/pyproject.toml
      - action: rebuild
        path: ./backend/poetry.lock
      # Compose watch skips the files in backend/.dockerignore, which lists the Dockerfile.
      # After a change to the Dockerfile, run "just stack build".

# The frontends read their settings from apps/<app>/.env.local in the source code mount.
x-frontend: &frontend
  build:
    context: frontend
    dockerfile_inline: |
      FROM ghcr.io/city-of-helsinki/tilavarauspalvelu-core-base:node-24-slim
      RUN apt-get update \
        && apt-get install -y --no-install-recommends socat \
        && rm -rf /var/lib/apt/lists/*
      RUN npm install -g corepack@latest && corepack enable
      ENV COREPACK_HOME=/corepack COREPACK_ENABLE_DOWNLOAD_PROMPT=0 HOME=/tmp
  image: varaamo-dev-frontend
  profiles: [frontend]
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /app
  volumes:
    - ./frontend:/app
    - ./tilavaraus.graphql:/tilavaraus.graphql:ro
    # Keep the dependencies and build output of the container apart from the host.
    # The host can have packages for another platform, for example macOS.
    - node-modules:/app/node_modules
    - node-modules-customer:/app/apps/customer/node_modules
    - node-modules-staff:/app/apps/staff/node_modules
    - node-modules-ui:/app/packages/ui/node_modules
    - node-modules-tsconfig:/app/packages/tsconfig/node_modules
    - next-customer:/app/apps/customer/.next
    - next-staff:/app/apps/staff/.next
    - corepack:/corepack

services:

  db:
    image: "postgis/postgis:17-3.5-alpine"
    platform: linux/amd64
    environment:
      POSTGRES_USER: tvp
      POSTGRES_PASSWORD: tvp
      POSTGRES_DB: tvp
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tvp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5555:5432"
    volumes:
      - tvp-postgres:/var/lib/postgresql/data

  redis:
    image: "redis:7-alpine"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  # Docker creates the named volumes owned by root. Give the media volume to the host user, then stop.
  backend-volumes:
    <<: *backend
    user: root
    entrypoint:
      - sh
      - -c
      - >-
        [ "$$(stat -c %u:%g /media)" = "${HOST_UID:-1000}:${HOST_GID:-1000}" ]
        || chown -R "${HOST_UID:-1000}:${HOST_GID:-1000}" /media

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-volumes:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    # The scripts in the source code mount are not executable. Run them with bash.
    entrypoint: ["bash", "/tvp/docker/entrypoint_dev.sh"]
    # Healthy after the migrations are done and the server runs.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/monitoring/liveness/')"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Celery does not reload code. Restart the worker and the scheduler after a change to task code.
  worker:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["bash", "/tvp/docker/worker.sh"]

  scheduler:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["bash", "/tvp/docker/scheduler.sh"]

  # The frontends share the network namespace of this container. It publishes the frontend ports
  # and forwards "localhost:8000" to the backend container. The frontends use one backend URL
  # for the server side rendering and for the browser, so "localhost:8000" must work in both places.
  frontend-net:
    <<: *frontend
    profiles: [frontend, frontend-release]
    init: true
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    command: ["socat", "TCP-LISTEN:8000,fork,reuseaddr", "TCP:backend:8000"]

  # Docker creates the named volumes owned by root. Give them to the host user, then stop.
  frontend-volumes:
    <<: *frontend
    profiles: [frontend, frontend-release]
    user: root
    command:
      - sh
      - -c
      - >-
        for directory in /app/node_modules /app/*/*/node_modules /app/apps/*/.next /corepack; do
        [ "$$(stat -c %u:%g "$$directory")" = "${HOST_UID:-1000}:${HOST_GID:-1000}" ]
        || chown -R "${HOST_UID:-1000}:${HOST_GID:-1000}" "$$directory";
        done

  # Installs the frontend dependencies and generates the GraphQL types, then stops.
  # Run it again after a change to pnpm-lock.yaml or tilavaraus.graphql.
  frontend-install:
    <<: *frontend
    profiles: [frontend, frontend-release]
    depends_on:
      frontend-volumes:
        condition: service_completed_successfully
    environment:
      # Prevents prompts from pnpm.
      CI: "true"
    command:
      - sh
      - -c
      - >-
        pnpm install --frozen-lockfile --ignore-scripts
        && pnpm codegen

  customer:
    <<: *frontend
    network_mode: service:frontend-net
    depends_on:
      frontend-install:
        condition: service_completed_successfully
    command: ["pnpm", "--filter", "customer", "run", "dev", "--hostname", "0.0.0.0"]
    environment:
      TZ: Europe/Helsinki

  staff:
    <<: *frontend
    network_mode: service:frontend-net
    depends_on:
      frontend-install:
        condition: service_completed_successfully
    command: ["pnpm", "--filter", "staff", "run", "dev", "--hostname", "0.0.0.0"]
    environment:
      TZ: Europe/Helsinki

  # The release services run "next build" and then "next start", so the pages with getStaticProps,
  # for example 404 and 500, work as in production. The code does not reload.
  # Restart the service to build again. "next dev" keeps its output in .next/dev, so the build does not remove it.
  # "next start" shows a warning about the "standalone" output. The production image runs the standalone server.
  customer-release:
    <<: *frontend
    profiles: [frontend-release]
    network_mode: service:frontend-net
    depends_on:
      frontend-install:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >-
        pnpm --filter customer run build
        && pnpm --filter customer run start --hostname 0.0.0.0
    environment: &frontend-release-environment
      TZ: Europe/Helsinki
      # Node and Turbopack see all the CPUs of the host, not the limits of the container.
      # The build uses a thread and memory for each CPU, and Docker can kill it when the memory runs out.
      # Set FRONTEND_BUILD_THREADS to change the limit.
      # next.config.ts reads NEXT_BUILD_CPUS for the number of build workers.
      NEXT_BUILD_CPUS: ${FRONTEND_BUILD_THREADS:-4}
      TOKIO_WORKER_THREADS: ${FRONTEND_BUILD_THREADS:-4}
      RAYON_NUM_THREADS: ${FRONTEND_BUILD_THREADS:-4}
    # Healthy after the build is done and the server runs. The build can take many minutes.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthcheck').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
      start_interval: 5s

  # Builds after the customer UI, so the two builds do not use memory at the same time.
  staff-release:
    <<: *frontend
    profiles: [frontend-release]
    network_mode: service:frontend-net
    depends_on:
      customer-release:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        pnpm --filter staff run build
        && pnpm --filter staff run start --hostname 0.0.0.0
    environment: *frontend-release-environment

volumes:
  tvp-postgres:
  tvp-media:
  node-modules:
  node-modules-customer:
  node-modules-staff:
  node-modules-ui:
  node-modules-tsconfig:
  next-customer:
  next-staff:
  corepack:

networks:
  default:
    name: helsinki

sonar.projectKey = City-of-Helsinki_tilavarauspalvelu-customer-ui
sonar.organization=city-of-helsinki
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.exclusions= \
  **/__mocks__/**/*, \
  **/__snapshots__/*, \
  **/*.d.ts

# Custom: don't care about frontend coverage for now
sonar.coverage.exclusions=**

sonar.test.inclusions= \
  **/__tests__/**/*, \
  **/*.test.js, \
  **/*.test.ts, \
  **/*.test.jsx, \
  **/*.test.tsx
